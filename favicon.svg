<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de brilho e difusão nebulosa -->
    <filter id="nebula-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Nebula Anil / Azul Profundo -->
    <radialGradient id="star-glow-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#4f46e5" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do Núcleo da Estrela (Branco Metálico / Azul Claro) -->
    <radialGradient id="star-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#c7d2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="#0b0d17"/>

  <!-- Grupo das 3 Estrelas do Cinturão de Orion em Diagonal -->
  <g filter="url(#nebula-glow)">
    
    <!-- ESTRELA 1: Média (Alnitak - Canto Inferior Esquerdo) -->
    <g transform="translate(138, 374)">
      <!-- Halo Nebuloso -->
      <circle cx="0" cy="0" r="75" fill="url(#star-glow-indigo)" />
      <!-- Núcleo Brilhante -->
      <circle cx="0" cy="0" r="22" fill="url(#star-core)" />
    </g>

    <!-- ESTRELA 2: Grande (Alnilam - Centro) -->
    <g transform="translate(256, 256)">
      <!-- Halo Nebuloso Expandido -->
      <circle cx="0" cy="0" r="105" fill="url(#star-glow-indigo)" />
      <!-- Núcleo Principal -->
      <circle cx="0" cy="0" r="32" fill="url(#star-core)" />
    </g>

    <!-- ESTRELA 3: Menor (Mintaka - Canto Superior Direito) -->
    <g transform="translate(374, 138)">
      <!-- Halo Nebuloso Suave -->
      <circle cx="0" cy="0" r="58" fill="url(#star-glow-indigo)" />
      <!-- Núcleo Compacto -->
      <circle cx="0" cy="0" r="16" fill="url(#star-core)" />
    </g>

  </g>
</svg>
