name: Pipeline

on:
  schedule:
    # 1. Quick Check (Hourly)
    - cron: '21 * * * *'
    
    # 2. Daily Full Scan
    - cron: '21 3 * * *'

  workflow_dispatch: # Manual execution via GitHub UI
    inputs:
      action:
        description: 'Select action:'
        type: choice
        default: 'only_transform'
        options:
          - 'quick_extraction_and_transform'
          - 'full_extraction_and_transform'
          - 'only_transform'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. EXTRACTOR STEP
      - name: Run Extractor Script
        if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'quick_extraction_and_transform' || github.event.inputs.action == 'full_extraction_and_transform' }}
        run: |
          if [ "${{ github.event.schedule }}" = "21 3 * * *" ] || [ "${{ github.event.inputs.action }}" = "full_extraction_and_transform" ]; then
            node extractor.js --full
          else
            node extractor.js
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 2. CHECK IF RAW DATA CHANGED
      - name: Check for raw-data.json changes
        id: check_raw
        run: |
          if git diff --name-only | grep -q 'raw-data.json'; then
            echo "raw_changed=true" >> $GITHUB_OUTPUT
          else
            echo "raw_changed=false" >> $GITHUB_OUTPUT
          fi

      # 3. TRANSFORMER STEP
      - name: Run Transformer Script (ETL)
        if: ${{ steps.check_raw.outputs.raw_changed == 'true' || github.event.inputs.action == 'only_transform' }}
        run: |
          echo "🚀 Running Data Transformer..."
          node transformer.js

      # 4. AUTO COMMIT
      - name: Save changes to Git (Auto Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          touch raw-data.json dataset.json
          git add raw-data.json dataset.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "BOT: UPDATE" && git push)