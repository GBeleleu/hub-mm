name: Pipeline

on:
  schedule:
    # 1. Checagem Rápida (Hora em hora)
    - cron: '21 * * * *'
    
    # 2. Varredura Completa Diária
    - cron: '21 3 * * *'

  workflow_dispatch: # Execução manual via painel do GitHub
    inputs:
      acao:
        description: 'Selecione a ação:'
        type: choice
        default: 'apenas_tratamento'
        options:
          - 'coleta_rapida_e_tratamento'
          - 'coleta_completa_e_tratamento'
          - 'apenas_tratamento'

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. PASSO DO IMPORTADOR
      - name: Executar Script de Importação
        if: ${{ github.event_name == 'schedule' || github.event.inputs.acao == 'coleta_rapida_e_tratamento' || github.event.inputs.acao == 'coleta_completa_e_tratamento' }}
        run: |
          if [ "${{ github.event.schedule }}" = "21 3 * * *" ] || [ "${{ github.event.inputs.acao }}" = "coleta_completa_e_tratamento" ]; then
            node importador.js --completa
          else
            node importador.js
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 2. VERIFICA SE O BANCO BRUTO FOI ALTERADO
      - name: Verificar se houve alteração em videos_bruto.json
        id: check_bruto
        run: |
          if git diff --name-only | grep -q 'videos_bruto.json'; then
            echo "bruto_alterado=true" >> $GITHUB_OUTPUT
          else
            echo "bruto_alterado=false" >> $GITHUB_OUTPUT
          fi

      # 3. PASSO DO TRATADOR
      - name: Executar Script de Tratamento (ETL)
        if: ${{ steps.check_bruto.outputs.bruto_alterado == 'true' || github.event.inputs.acao == 'apenas_tratamento' }}
        run: |
          echo "🚀 Executando Tratador de Dados..."
          node tratador.js

      # 4. AUTO COMMIT
      - name: Salvar alterações no Git (Auto Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add videos_bruto.json database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "BOT:UPDATE" && git push)
