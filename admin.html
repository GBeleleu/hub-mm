<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gerenciador de Taxonomia</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --text-main: #e0e0e0;
      --accent-color: #66b3ab;
      --border-color: #333333;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    button, input[type="file"] {
      padding: 8px 12px;
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent-color); }
    .item-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg-secondary);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .item-title { flex: 1; font-size: 13px; font-weight: bold; }
    .item-id { font-family: monospace; font-size: 11px; color: #888; width: 110px; }
    input[type="text"] {
      padding: 6px 10px;
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>Admin - Taxonomia dos Vídeos</h2>
      <div>
        <label>
          Importar JSON Inicial: 
          <input type="file" id="importJsonInput" accept=".json">
        </label>
        <button id="exportBtn" style="border-color: var(--accent-color); margin-left: 10px;">Exportar taxonomia.json</button>
      </div>
    </div>

    <div id="itemsContainer">Carregando dados...</div>
  </div>

  <script>
    let database = [];
    let taxonomyMap = {};

    async function init() {
      try {
        // Carrega database.json e taxonomia.json (se existir)
        const [resDb, resTax] = await Promise.allSettled([
          fetch('database.json').then(r => r.json()),
          fetch('taxonomia.json').then(r => r.json())
        ]);

        if (resDb.status === 'fulfilled') database = resDb.value;
        if (resTax.status === 'fulfilled') taxonomyMap = resTax.value;

        renderAdminList();
      } catch (e) {
        document.getElementById('itemsContainer').innerHTML = 'Erro ao carregar dados.';
      }
    }

    function renderAdminList() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      database.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const currentValue = taxonomyMap[item.videoId] || item.taxonomia || item.categoria || '';

        row.innerHTML = `
          <span class="item-id">${item.videoId}</span>
          <span class="item-title">${item.titulo}</span>
          <input type="text" style="width: 320px;" placeholder="cat:Série | grupo:Nome" value="${currentValue}" onchange="updateTaxonomy('${item.videoId}', this.value)">
        `;
        container.appendChild(row);
      });
    }

    function updateTaxonomy(videoId, value) {
      if (!value.trim()) {
        delete taxonomyMap[videoId];
      } else {
        taxonomyMap[videoId] = value.trim();
      }
    }

    // Importador do JSON inicial: {"videoId": "Categoria"}
    document.getElementById('importJsonInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const mapping = JSON.parse(event.target.result);
          let count = 0;

          Object.keys(mapping).forEach(id => {
            const val = mapping[id];
            taxonomyMap[id] = val.includes(':') ? val : `cat:${val}`;
            count++;
          });

          alert(`${count} categorias importadas!`);
          renderAdminList();
        } catch (err) {
          alert('Erro ao ler o arquivo de importação.');
        }
      };
      reader.readAsText(file);
    });

    // Exporta estritamente o arquivo taxonomia.json no formato {"ID": "Prefixos"}
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(taxonomyMap, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "taxonomia.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
