<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gerenciador de Tags</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --text-main: #e0e0e0;
      --accent-color: #66b3ab;
      --border-color: #333333;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    button {
      padding: 8px 16px;
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: var(--accent-color); color: #121212; }
    .item-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg-secondary);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .item-title { flex: 1; font-size: 13px; font-weight: bold; }
    .item-id { font-family: monospace; font-size: 11px; color: #888; width: 110px; }
    input[type="text"] {
      padding: 8px 10px;
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>Admin — Gerenciador de Tags (Taxonomia)</h2>
      <button id="exportBtn">Exportar taxonomia.json 💾</button>
    </div>

    <div id="itemsContainer">Carregando dados...</div>
  </div>

  <script>
    let database = [];
    let taxonomyMap = {};

    async function init() {
      try {
        const [resDb, resTax] = await Promise.allSettled([
          fetch('database.json').then(r => r.json()),
          fetch('taxonomia.json').then(r => r.json())
        ]);

        if (resDb.status === 'fulfilled') database = resDb.value;
        if (resTax.status === 'fulfilled') taxonomyMap = resTax.value;

        renderAdminList();
      } catch (e) {
        document.getElementById('itemsContainer').innerHTML = 'Erro ao carregar dados.';
      }
    }

    function renderAdminList() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      database.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const currentValue = taxonomyMap[item.videoId] || '';

        row.innerHTML = `
          <span class="item-id">${item.videoId}</span>
          <span class="item-title">${item.titulo}</span>
          <input type="text" style="width: 360px;" placeholder="Ex: Categoria | Grupo | Playlist" value="${currentValue}" onchange="updateTaxonomy('${item.videoId}', this.value)">
        `;
        container.appendChild(row);
      });
    }

    function updateTaxonomy(videoId, value) {
      if (!value.trim()) {
        delete taxonomyMap[videoId];
      } else {
        taxonomyMap[videoId] = value.trim();
      }
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(taxonomyMap, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "taxonomia.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
