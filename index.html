<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>[meuGuia]</title>
  
  <!-- Estilos Separados -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- BARRA FIXA SUPERIOR -->
  <header class="top-bar" id="topBar">
    <div class="controls-container">

      <!-- BOTÕES DE MODO DE EXIBIÇÃO (EXIBIR) -->
      <div class="control-group-wrapper">
        <span class="control-label">Exibir:</span>
        <div class="button-group" id="displayModeGroup">
          <button class="btn-group-item" data-display="lista" title="Exibição em lista">
            <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3,4H21V8H3V4M3,10H21V14H3V10M3,16H21V20H3V16Z"/></svg>
            <!-- Lista -->
          </button>
          <button class="btn-group-item active" data-display="compacto" title="Exibição compacta">
            <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 16h11v4H10zm-7 0h5v5H3zm7-6h11v4H10zm-7 0h5v4H3zm7-6h11v4H10zM3 3h5v5H3z "/></svg>
            <!-- Compacto -->
          </button>
          <button class="btn-group-item" data-display="grade" title="Exibição em grade">
            <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3,11H11V3H3M3,21H11V13H3M13,21H21V13H13M13,3V11H21V3"/></svg>
            <!-- Grade -->
          </button>
        </div>
      </div>

      <!-- BOTÕES DE ORGANIZAÇÃO (ORGANIZAR) -->
      <div class="control-group-wrapper">
        <span class="control-label">Organizar:</span>
        <div class="button-group" id="organizeGroup">
          
          <!-- Botão Consolidado (Verde Escuro quando ativo) -->
          <button class="btn-group-item highlighted" data-organize="consolidado" title="Ideal para estudo. Agrupa vídeos iguais.">
            <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19,11H5V9H19M16,15H8V13H16M20,3H4C2.9,3 2,3.9 2,5V19C2,20.1 2.9,21 4,21H20C21.1,21 22,20.1 22,19V5C22,3.9 21.1,3 20,3Z"/></svg>
            Consolidado
          </button>

          <!-- Menu Dropdown para Sequenciado (Misturado / Blocos) -->
          <div class="dropdown-wrapper" id="sequencedDropdown">
            <button class="btn-group-item dropdown-toggle-btn" id="sequencedToggleBtn" title="Opções Sequenciadas">
              <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3,13H15V11H3M3,6V8H21V6M3,18H9V16H3V18Z"/></svg>
              <span id="sequencedActiveLabel">Misturado</span> ▼
            </button>
            <div class="dropdown-menu" id="sequencedMenu" style="display: none;">
              <button class="dropdown-item" data-organize="sequenciado">Misturado</button>
              <button class="dropdown-item" data-organize="sequenciado-canais">Blocos</button>
            </div>
          </div>

        </div>
      </div>

      <!-- BUSCA -->
      <div class="search-box" style="position: relative;">
        <input type="text" id="searchInput" placeholder="Buscar por título..." style="padding-right: 32px;">
        <button id="clearSearchBtn" title="Limpar busca" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; display: none; padding: 2px 6px;">✕</button>
      </div>

      <!-- ORDENAÇÃO E FILTROS -->
      <div class="filter-group">
        <select id="sortBySelect">
          <option value="data">Data de Publicação</option>
          <option value="titulo">Título</option>
          <option value="duracao">Duração</option>
          <option value="ocorrencias">Ocorrências</option>
          <option value="categoria">Categoria</option>
          <option value="progresso">Status</option>
        </select>

        <button id="sortOrderBtn" title="Inverter Ordem">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3L5 7h3v7h2V7h3L9 3zm6 18l4-4h-3V10h-2v7h-3l4 4z"/></svg>
          <span id="sortOrderLabel">Asc ▲</span>
        </button>
        <button id="taxonomyModalBtn">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          Grupos
        </button>
        <button id="channelsModalBtn">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15l7-3-7-3v6z"/></svg>
          Canais
        </button>
      </div>

      <!-- USER AUTH -->
      <div id="authContainer" style="display: flex; gap: 8px; align-items: center;">
        <button id="loginBtn" onclick="window.loginWithGoogle()" title="Entre para registrar seu progresso">Entrar</button>
        <span id="userEmailSpan" style="display: none; font-size: 12px; color: var(--accent-color); font-weight: bold;"></span>
        <button id="logoutBtn" onclick="window.logoutFromFirebase()" style="display: none;">Sair</button>
      </div>

      <!-- EXPORT / IMPORT -->
      <div id="dataToolsGroup" style="display: flex; gap: 6px; align-items: center;">
        <button onclick="window.exportProgressJSON()" title="Exportar progresso (JSON)">📤</button>
        <button onclick="document.getElementById('importJsonInput').click()" title="Importar progresso (JSON)">📥</button>
        <input type="file" id="importJsonInput" accept=".json" style="display: none;" onchange="window.importProgressJSON(event)">
      </div>

      <!-- CONTROLE TEMPORAL -->
      <div class="nav-time-container" id="navTimeContainer">
        <div class="nav-unit">
          <button class="arrow-btn" id="yearUpBtn">▲</button>
          <select id="yearSelect"><option value="">Ano</option></select>
          <button class="arrow-btn" id="yearDownBtn">▼</button>
        </div>
        <div class="nav-unit">
          <button class="arrow-btn" id="monthUpBtn">▲</button>
          <select id="monthSelect">
            <option value="0">Jan</option><option value="1">Fev</option>
            <option value="2">Mar</option><option value="3">Abr</option>
            <option value="4">Mai</option><option value="5">Jun</option>
            <option value="6">Jul</option><option value="7">Ago</option>
            <option value="8">Set</option><option value="9">Out</option>
            <option value="10">Nov</option><option value="11">Dez</option>
          </select>
          <button class="arrow-btn" id="monthDownBtn">▼</button>
        </div>
      </div>

    </div>
  </header>

  <!-- LISTAGEM DE CARDS VERTICAIS -->
  <main class="container" id="videoListContainer">
    <div class="status-message">Carregando dados...</div>
  </main>
  
  <!-- MODAL DE PREVIEW DA THUMBNAIL -->
  <div class="modal-overlay" id="thumbPreviewModal">
    <div class="modal-card" style="max-width: 600px; text-align: center;">
      <div class="modal-header">
        <h3 id="thumbModalTitle" style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Visualizar Thumbnail</h3>
        <button id="closeThumbModalBtn">&times;</button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0;">
        <img id="thumbModalImg" src="" alt="Thumbnail Ampliada" style="width: 100%; max-height: 380px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border-color);">
        <a id="thumbModalWatchBtn" href="#" target="_blank" class="yt-watch-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" style="width:18px; height:18px; fill:#210000;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          Assistir no YouTube
        </a>
      </div>
    </div>
  </div>

  <!-- MODAL DE OCORRÊNCIAS (MODO ÍCONES) -->
  <div class="modal-overlay" id="occurrencesModal">
    <div class="modal-card" style="max-width: 700px;">
      <div class="modal-header">
        <h3>Ocorrências do Vídeo</h3>
        <button id="closeOccurrencesModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="occurrencesListContainer"></div>
    </div>
  </div>

  <!-- MODAL DINÂMICO DE TAXONOMIA -->
  <div class="modal-overlay" id="taxonomyModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Filtrar por Taxonomia</h3>
        <button id="closeTaxonomyModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="taxonomyListContainer"></div>
      <div class="modal-actions">
        <div>
          <button id="selectAllTaxonomyBtn">Marcar Todos</button>
          <button id="deselectAllTaxonomyBtn">Desmarcar Todos</button>
        </div>
        <button id="applyTaxonomyBtn" style="border-color: var(--accent-color);">Aplicar</button>
      </div>
    </div>
  </div>
  
  <!-- MODAL DE FILTRO POR CANAL -->
  <div class="modal-overlay" id="channelsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Filtrar por Canal</h3>
        <button id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="channelsListContainer"></div>
      <div class="modal-actions">
        <div>
          <button id="selectAllChannelsBtn">Marcar Todos</button>
          <button id="deselectAllChannelsBtn">Desmarcar Todos</button>
        </div>
        <button id="applyChannelsBtn" style="border-color: var(--accent-color);">Aplicar</button>
      </div>
    </div>
  </div>

  <!-- MÓDULOS JAVASCRIPT -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
